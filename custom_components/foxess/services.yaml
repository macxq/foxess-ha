set_schedule:
  name: Set schedule
  description: Overwrite the FoxESS inverter mode schedule with configured time segments.
  fields:
    device_sn:
      name: Inverter serial number
      description: The FoxESS deviceSN to apply the schedule to.
      required: true
      example: "60BH1234567"
      selector:
        text:
    groups:
      name: Schedule groups
      description: List of schedule groups defining time periods and work modes.
      required: true
      selector:
        object:
    enable:
      name: Enable scheduler
      description: Automatically enable the scheduler flag on the inverter.
      default: true
      selector:
        boolean:
    is_default:
      name: Is default schedule
      description: Whether this represents the default schedule.
      default: false
      selector:
        boolean:
set_force_charge_times:
  name: Set force charge times
  description: Configure grid force charge time slots for FoxESS inverters supporting forceChargeTime (such as AIO-H3 or older firmware).
  fields:
    device_sn:
      name: Inverter serial number
      description: The FoxESS deviceSN to apply the force charge times to.
      required: true
      example: "60BH1234567"
      selector:
        text:
    enable_1:
      name: Enable slot 1
      description: Enable or disable force charge slot 1.
      default: true
      selector:
        boolean:
    start_time_1:
      name: Slot 1 start time
      description: Start time for slot 1 (e.g. "02:00").
      example: "02:00"
      selector:
        time:
    end_time_1:
      name: Slot 1 end time
      description: End time for slot 1 (e.g. "05:00").
      example: "05:00"
      selector:
        time:
    enable_2:
      name: Enable slot 2
      description: Enable or disable force charge slot 2.
      default: false
      selector:
        boolean:
    start_time_2:
      name: Slot 2 start time
      description: Start time for slot 2 (e.g. "14:00").
      example: "14:00"
      selector:
        time:
    end_time_2:
      name: Slot 2 end time
      description: End time for slot 2 (e.g. "16:00").
      example: "16:00"
      selector:
        time:
